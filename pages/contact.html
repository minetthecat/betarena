<div style="margin-bottom:32px"><div style="font-size:13px;letter-spacing:.08em;color:#C8F135">/www/contact</div><h1 style="margin:8px 0 0;font:700 44px/1.1 Sora,sans-serif">Kontakty</h1><p style="margin:12px 0 0;font-size:17px;color:#9DB0A5">Máš dotaz? Napiš nám nebo zavolej.</p></div><div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start"><div style="flex:1 1 320px;display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-direction:column;gap:8px;padding:28px;border:1px solid #26352D;border-radius:16px;background:#16201B;gap:4px"><div style="font-size:12px;letter-spacing:.08em;color:#9DB0A5">E-MAIL PODPORY</div><div style="font:600 17px Manrope,sans-serif">[podpora@example.cz]</div></div><div style="display:flex;flex-direction:column;gap:8px;padding:28px;border:1px solid #26352D;border-radius:16px;background:#16201B;gap:4px"><div style="font-size:12px;letter-spacing:.08em;color:#9DB0A5">TELEFON</div><div style="font:600 17px Manrope,sans-serif">[+420 000 000 000]</div></div><div style="display:flex;flex-direction:column;gap:8px;padding:28px;border:1px solid #26352D;border-radius:16px;background:#16201B;gap:4px"><div style="font-size:12px;letter-spacing:.08em;color:#9DB0A5">ADRESA</div><div style="font:600 17px Manrope,sans-serif">[Ulice 0, Město]</div></div><div style="display:flex;flex-direction:column;gap:8px;padding:28px;border:1px solid #26352D;border-radius:16px;background:#16201B;gap:4px"><div style="font-size:12px;letter-spacing:.08em;color:#9DB0A5">PROVOZNÍ DOBA</div><div style="font:600 17px Manrope,sans-serif">[Po–Ne, 0:00–24:00]</div></div></div><form style="flex:1 1 400px;display:flex;flex-direction:column;gap:20px;padding:32px;border:1px solid #26352D;border-radius:20px;background:#16201B"><div style="display:flex;flex-direction:column;gap:8px"><label for="c-n" style="font:600 14px Manrope,sans-serif">Jméno</label><input id="c-n" type="text" placeholder="Jan Novák" style="height:48px;box-sizing:border-box;padding:0 16px;border:1px solid #26352D;border-radius:12px;background:#0D1411;color:#EEF3EF;font:15px Manrope,sans-serif;outline:none"></div><div style="display:flex;flex-direction:column;gap:8px"><label for="c-m" style="font:600 14px Manrope,sans-serif">E-mail</label><input id="c-m" type="email" placeholder="jmeno@example.cz" style="height:48px;box-sizing:border-box;padding:0 16px;border:1px solid #26352D;border-radius:12px;background:#0D1411;color:#EEF3EF;font:15px Manrope,sans-serif;outline:none"></div><div style="display:flex;flex-direction:column;gap:8px"><label for="c-t" style="font:600 14px Manrope,sans-serif">Zpráva</label><textarea id="c-t" rows="5" placeholder="Napiš nám, s čím potřebuješ pomoct" style="padding:14px 16px;border:1px solid #26352D;border-radius:12px;background:#0D1411;color:#EEF3EF;font:15px Manrope,sans-serif;resize:vertical;outline:none"></textarea></div><button type="button" style="height:52px;border:0;border-radius:999px;background:#C8F135;color:#0D1411;font:600 16px Manrope,sans-serif;cursor:pointer">Odeslat zprávu</button></form></div>
