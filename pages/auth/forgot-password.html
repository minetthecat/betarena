<link rel="stylesheet" href="/services/auth.css">
<section class="auth-card">
  <div><div class="auth-url">/auth/forgot-password</div><h1 data-role="title">Žádost o obnovení hesla</h1>
  <p>Zadej e-mail k účtu. Pošleme ti odkaz pro nastavení nového hesla.</p></div>
  <form data-auth="forgot" novalidate>
    <div class="auth-field"><label for="auth-email">E-mail</label><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="jmeno@example.cz"><div class="auth-error" data-error-for="email"></div></div>
    <div class="auth-msg" role="alert" hidden></div>
    <button class="auth-btn" type="submit">Odeslat odkaz</button>
  </form>
  <div class="auth-foot"><a href="/auth/login">Zpět na přihlášení</a></div>
</section>
<script src="/services/auth.js?v=20261023-2" defer></script>
