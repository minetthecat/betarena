<link rel="stylesheet" href="/services/auth.css">
<section class="auth-card">
  <div><div class="auth-url">/auth/login</div><h1 data-role="title">Přihlášení</h1></div>
  <form data-auth="login" data-auth-redirect="/casino" novalidate>
    <div class="auth-field"><label for="auth-email">E-mail</label><input id="auth-email" name="email" required aria-describedby="auth-error-email" type="email" autocomplete="email" placeholder="jmeno@example.cz"><div class="auth-error" id="auth-error-email" data-error-for="email"></div></div>
    <div class="auth-field"><label for="auth-password">Heslo</label><input id="auth-password" name="password" required aria-describedby="auth-error-password" type="password" autocomplete="current-password" placeholder="••••••••"><div class="auth-error" id="auth-error-password" data-error-for="password"></div></div>
    <div class="auth-msg" role="alert" hidden></div>
    <button class="auth-btn" type="submit">Přihlásit se</button>
  </form>
  <div class="auth-foot">Nemáš účet? <a href="/auth/register">Registrace</a><br><a href="/auth/forgot-password">Zapomenuté heslo?</a></div>
</section>
<script src="/services/auth.js?v=20261023-2" defer></script>
