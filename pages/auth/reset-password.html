<link rel="stylesheet" href="/services/auth.css">
<section class="auth-card">
  <div><div class="auth-url">/auth/reset-password?token=…</div><h1 data-role="title">Nastavení nového hesla</h1>
  <p>Zvol nové heslo pro svůj účet.</p></div>
  <form data-auth="reset" novalidate>
    <div class="auth-field"><label for="auth-password">Nové heslo</label><input id="auth-password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" data-strength><div class="auth-error" data-error-for="password"></div></div>
    <div class="auth-strength"><div class="auth-bars"><span></span><span></span><span></span><span></span></div><div class="auth-foot" style="text-align:left">Síla hesla: <strong data-role="strength">–</strong> &middot; alespoň 8 znaků</div></div>
    <div class="auth-field"><label for="auth-password_confirm">Potvrzení nového hesla</label><input id="auth-password_confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="••••••••"><div class="auth-error" data-error-for="password_confirm"></div></div>
    <div class="auth-msg" role="alert" hidden></div>
    <button class="auth-btn" type="submit">Změnit heslo</button>
  </form>
  <a class="auth-btn" data-role="link" href="/auth/login" hidden>Přihlásit se</a>
</section>
<script src="/services/auth.js?v=20261023-2" defer></script>
